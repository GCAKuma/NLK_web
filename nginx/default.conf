upstream django {
    server web:8000;
}

# ---- HTTP ----
# For a real deployment, uncomment the redirect below and the HTTPS server, and
# mount your certificates (see docs). Left on HTTP so the stack runs locally.
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;   # bank slip / invoice uploads

    # return 301 https://$host$request_uri;   # enable once TLS is configured

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

