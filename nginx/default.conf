upstream django {
    server web:8000;
}

# ---- HTTP ----
# For a real deployment: point DNS at this server, issue the certificate (see
# README "Enable HTTPS"), then uncomment the redirect below and the HTTPS
# server block. Left on plain HTTP so the stack runs locally without a domain.
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;   # bank slip / invoice uploads

    # Let's Encrypt's ACME HTTP-01 challenge — must stay reachable over plain
    # HTTP even after the redirect below is enabled, so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # return 301 https://$host$request_uri;   # enable once TLS is configured

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

