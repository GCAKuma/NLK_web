{% extends "admin/base.html" %}
{% load i18n %}

{% block title %}{{ title }} | {{ site_title|default:_('NLK Admin') }}{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}">{{ site_header|default:_('NLK Control Panel') }}</a>
</div>
{% endblock %}

{% block extrastyle %}{{ block.super }}
<style>
  html:root[data-theme] {
    --primary: #0B3278;
    --secondary: #0B3278;
    --accent: #1456C0;
    --link-fg: #1456C0;
    --link-hover-color: #1048A3;
    --header-color: #ffffff;
    --header-branding-color: #ffffff;
    --breadcrumbs-fg: #cbd5e1;
    --default-button-bg: #1456C0;
    --button-bg: #1456C0;
    --button-hover-bg: #1048A3;
  }
  #site-name a:link, #site-name a:visited { color: #fff; }
  html:root[data-theme="dark"] { --link-fg: #8bbbff; --link-hover-color: #bad7ff; }
  @media (prefers-color-scheme: dark) {
    html:root[data-theme="auto"] { --link-fg: #8bbbff; --link-hover-color: #bad7ff; }
  }
</style>
{% endblock %}
