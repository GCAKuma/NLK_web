{% extends "base.html" %}
{% block title %}Reset password — NLK{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-4 py-12">
  <div class="card border border-line p-8">
    <h1 class="font-heading font-bold text-2xl text-ink">Reset your password</h1>
    <p class="text-sm text-muted mt-1 mb-6">Enter your email and we'll send you a reset link.</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="field-label" for="{{ form.email.id_for_label }}">Email</label>
        <input type="email" name="email" required class="field-input"
               id="{{ form.email.id_for_label }}" value="{{ form.email.value|default:'' }}">
        {% for e in form.email.errors %}<p class="text-xs text-red-600 mt-1">{{ e }}</p>{% endfor %}
      </div>
      <button type="submit" class="btn-primary w-full">Send reset link</button>
    </form>
    <p class="text-sm text-center mt-4"><a href="{% url 'accounts:login' %}" class="text-ink hover:text-link">Back to log in</a></p>
  </div>
</section>
{% endblock %}
