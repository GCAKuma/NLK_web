{% spaceless %}
<span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-full
  {% if order.status == 'delivered' or order.status == 'confirmed' %}bg-green-100 text-green-700
  {% elif order.status == 'cancelled' %}bg-red-100 text-red-700
  {% elif order.status == 'shipped' %}bg-blue-100 text-blue-700
  {% elif order.status == 'payment_verification' %}bg-amber-100 text-amber-700
  {% else %}bg-elevated text-ink{% endif %}">
  {{ order.get_status_display }}
</span>
{% endspaceless %}
