# Production stack: nginx -> gunicorn (web) + db + redis + celery.
# Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d

services:
  db:
    image: postgres:16
    env_file: .env.prod
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    entrypoint: ["sh", "/app/deploy/entrypoint.sh"]
    command:
      ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000",
       "--workers", "3", "--timeout", "60",
       "--access-logfile", "-", "--error-logfile", "-"]
    env_file: .env.prod
    volumes:
      - static_prod:/app/staticfiles
      - media_prod:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    env_file: .env.prod
    volumes:
      - media_prod:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod:/app/staticfiles:ro
      - media_prod:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/nginx/certs:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - web
    restart: unless-stopped

  # One-time cert issuance + automatic renewal. See README "Enable HTTPS".
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot -q; sleep 12h & wait $${!}; done;"

volumes:
  pgdata_prod:
  static_prod:
  media_prod:
  certbot_www:
  certbot_conf:
