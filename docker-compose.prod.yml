# AWS / Supabase production stack. Configure .env.prod and nginx/active.conf first.
name: nlk-production

x-app: &app
  image: nlk-web:${RELEASE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile.prod
  env_file: .env.prod
  init: true
  restart: unless-stopped
  volumes:
    - static_prod:/app/staticfiles
    - media_prod:/app/media
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_prod:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  web:
    <<: *app
    command: [gunicorn, config.wsgi:application, --bind, "0.0.0.0:8000", --workers, "2", --timeout, "60", --access-logfile, "-", --error-logfile, "-"]
    depends_on:
      redis: {condition: service_healthy}
    expose: ["8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3

  celery:
    <<: *app
    command: [celery, -A, config, worker, -l, info, --concurrency, "1", --max-tasks-per-child, "100"]
    depends_on:
      redis: {condition: service_healthy}

  dispatcher:
    <<: *app
    command: [python, manage.py, dispatch_notifications]
    depends_on:
      redis: {condition: service_healthy}

  migrate:
    <<: *app
    profiles: [tools]
    restart: "no"
    env_file: [.env.prod, .env.migrate]
    command: [python, manage.py, migrate, --noinput]

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod:/app/staticfiles:ro
      - media_prod:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    ports: ["80:80", "443:443"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  certbot:
    image: certbot/certbot
    profiles: [tools]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Explicit one-shot certbot commands; renewal is managed by the host timer.
    entrypoint: [certbot]

  backup:
    image: ${PG_CLIENT_IMAGE:-postgres:17}
    profiles: [tools]
    env_file: .env.migrate
    volumes:
      - ./backups:/backups
    entrypoint: [sh, -c]
    command: ['umask 077; pg_dump "$$DATABASE_URL" --no-owner --no-privileges --format=custom --schema=public --file="/backups/nlk-$$(date -u +%Y%m%dT%H%M%SZ).dump"']

volumes:
  static_prod:
  media_prod:
  redis_prod:
  certbot_www:
  certbot_conf:
